name: seqsuite
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # command-line tools
  - cutadapt
  - bwa
  - samtools
  - gnuplot
  - bbmap          # core.NGSanalysis_module.process_reads only
  # Python libraries
  - pysam
  - biopython
  - numpy
  - pandas
  - pyyaml
  - matplotlib
  - jupyterlab
  - pip
  - pip:
      - -e .       # installs the core package from this folder
