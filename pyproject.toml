[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seqsuite"
version = "0.1.0"
description = "Kellogg Lab tools for sequence-based assays: CAST tagmentation, UdiTaS, ChIP-seq"
requires-python = ">=3.9"
dependencies = ["biopython", "numpy", "pandas", "matplotlib", "pysam"]

[tool.setuptools]
packages = ["seqsuite", "tagmentation"]
