[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seqsuite"
version = "0.1.0"
description = "Kellogg Lab tools for sequence-based assays: shared functions in core/, one app per assay"
requires-python = ">=3.9"
dependencies = ["biopython", "numpy", "pandas", "matplotlib", "pysam"]

[tool.setuptools]
packages = ["core", "apps", "apps.ecoli_profiling"]
